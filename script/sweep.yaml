program: AdaMuon_to_SAM.py
method: bayes
metric:
  name: test_acc
  goal: maximize

# early_terminate:
#   type: hyperband
#   min_iter: 20
#   eta: 3

command:
  - ${env}
  - python
  - ${program}
  - ${args_no_boolean_flags}

parameters:
  model:
    value: "WideResNet16_8"
  
  epochs:
    value: 200

  lr:
    distribution: log_uniform_values
    min: 0.001
    max: 0.01

  bs:
    # values: [64, 128, 256]
    value: 256

  wd:
    value: 5e-4

  start_SAM:
    # values: [90, 100, 110]
    value: 175

  end_SAM:
    value: 200

  rho:
    # values: [0.2, 0.5, 1.0]
    value: 1.0

  adaptive:
    value: true

  # step_size:
    # value: "60 120"

  step_saving:
    value: 200