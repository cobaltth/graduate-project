program: AdaMuon_to_SAM.py
method: bayes
metric:
  name: test_acc
  goal: maximize

# command:
#   - ${env}
#   - python
#   - ${program}
#   - ${args_no_boolean_flags}

parameters:
  epochs:
    value: 120

  lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01

  bs:
    values: [64, 128, 256]

  wd:
    value: 5e-4

  start_SAM:
    value: 100

  end_SAM:
    value: 120

  rho:
    values: [0.1, 0.2, 0.5, 1.0, 2.0]

  adaptive:
    value: true

  # step_size:
    # value: "60 120"

  step_saving:
    value: 120