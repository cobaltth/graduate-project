program: AdaMuon_plus_SAM.py
method: grid
metric:
  name: final_test_acc      # 가장 긴 T의 마지막 test_acc
  goal: maximize

command:
  - ${env}
  - python
  - ${program}
  - ${args_no_boolean_flags}

parameters:
  model:
    value: "ResNet18"

  total_epochs:
    value: "30,60,90,120"    # 기존 epochs: 40 대체. 공유 trunk에서 분기할 총 epoch 목록

  decay_ratio:
    value: 0.2

  warmup_epochs:
    value: 4                # 기존 int(40 * 0.03) = 1과 동일

  decay_type:
    value: "1-sqrt"

  lr:
    # values: [2.0e-3, 3.0e-3, 5.0e-3]
    value: 1.0e-3           # 소수점 표기 (2e-3은 문자열로 읽힘)

  bs:
    value: 256

  wd:
    value: 5.0e-4

  rho:
    value: 5.0

  adaptive:
    value: true

  seed:
    values: [1, 2, 3]
