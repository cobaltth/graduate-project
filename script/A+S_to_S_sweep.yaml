program: A+S_to_S.py
method: grid
metric:
  name: test_acc
  goal: maximize

# early_terminate:
#   type: hyperband
#   min_iter: 20
#   eta: 3

command:
  - ${env}
  - python
  - ${program}
  - ${args_no_boolean_flags}

parameters:
  model:
    # value: "WideResNet16_8"
    value: "ResNet18"
  
  epochs:
    value: 120
    # value: 40

  lr:
    # distribution: log_uniform_values
    # min: 2e-3
    # max: 5e-3
    value: 2e-3

  bs:
    # values: [128, 256]
    value: 256

  wd:
    value: 5e-4
    
  rho:
    # values: [2.0, 5.0]
    # value: 5e-2
    value: 5.0

  start_SAM:
    # value: 100
    values: [0, 20, 40]
    
  end_SAM:
    value: 120

  sam_lr:
    value: 2e-1

  sam_rho:
    value: 1.0

  adaptive:
    value: true

  seed:
    values: [1, 2, 3]
